name: CI Pomodoro Timer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Probamos en las versiones estables y la 3.14 en desarrollo
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14-dev"]

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8 bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Calidad de Código (Flake8)
      run: |
        # Errores críticos de Python
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Estilo y complejidad (advertencias)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Auditoría de Seguridad (Bandit)
      run: |
        # Analiza la carpeta src en busca de vulnerabilidades
        bandit -r src/ -ll

    - name: Tests y Cobertura (Pytest-Cov)
      run: |
        # Ejecutamos pytest midiendo la cobertura de la carpeta src
        # Incluimos los submódulos (utils, etc)
        pytest --cov=src --cov-report=term-missing